version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5010:5000"
    environment:
      # Using standard PostgreSQL connection (no WebSockets)
      - DATABASE_URL=postgres://postgres:postgres@db:5432/fishtracker
      - NODE_ENV=production
      # Required for login/backup over http://localhost — Secure cookies are skipped on HTTP unless this is false
      - SESSION_COOKIE_SECURE=false
      # Email-only password reset (no SMTP); see /forgot-password — disable on public internet
      - ALLOW_EMAIL_ONLY_PASSWORD_RESET=true
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - SESSION_SECRET=fishing_session_secret_key_here
      - PGHOST=db
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGDATABASE=fishtracker
      - PGPORT=5432
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fish-tracker-network

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=fishtracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fish-tracker-network

networks:
  fish-tracker-network:
    driver: bridge

volumes:
  postgres_data: